[project]
name = "steamcn-home-content"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.8,<3",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx[http2]>=0.27,<1",
    "imageio-ffmpeg==0.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.package-data]
home_content = ["game_sources.json"]
